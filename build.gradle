plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'fabric-loom' version "${loom_version}"
}

group = maven_group
version = mod_version
base {
    archivesName = archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

kotlin {
    jvmToolchain(21)
}

repositories {
    maven { name = 'fabricmc'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { name = 'minecraft-libraries'; url = 'https://libraries.minecraft.net/' }
    maven { name = 'shedaniel'; url = 'https://maven.shedaniel.me/' }
}

def bundledFabricModules = [
        'fabric-api-base',
        'fabric-block-view-api-v2',
        'fabric-command-api-v2',
        'fabric-events-interaction-v0',
        'fabric-item-group-api-v1',
        'fabric-key-binding-api-v1',
        'fabric-lifecycle-events-v1',
        'fabric-message-api-v1',
        'fabric-model-loading-api-v1',
        'fabric-networking-api-v1',
        'fabric-object-builder-api-v1',
        'fabric-registry-sync-v0',
        'fabric-renderer-api-v1',
        'fabric-renderer-indigo',
        'fabric-rendering-v1',
        'fabric-resource-loader-v0',
        'fabric-screen-api-v1',
        'fabric-transitive-access-wideners-v1'
]

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"

    // Bundle all required Fabric API modules via Jar-in-Jar so the mod runs standalone
    // (and deduplicates cleanly if full Fabric API is also installed)
    bundledFabricModules.each { moduleName ->
        def modDep = fabricApi.module(moduleName, fabric_api_version)
        modImplementation(modDep)
        include(modDep)
    }

    // Bundle optimized multi-arch MCEF directly inside the jar
    implementation project(path: ':mcef', configuration: 'namedElements')
    include project(':mcef')

    // Bundle Cloth Config directly inside the jar
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/webdisplays.accesswidener')

    runs {
        client {
            vmArg '-Dfabric.debug.logRequests=true'
        }
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${archives_base_name}" }
    }
    manifest {
        attributes(
                'Implementation-Title': 'WebDisplays',
                'Implementation-Vendor': 'CinemaMod Group & WebDisplays Contributors',
                'Implementation-Version': project.version
        )
    }
}
