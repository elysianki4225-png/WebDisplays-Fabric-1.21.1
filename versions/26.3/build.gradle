plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'maven-publish'
}

version = "${project.mod_version}-${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

def bundledFabricModules = [
    'fabric-api-base',
    'fabric-block-api-v1',
    'fabric-block-getter-api-v2',
    'fabric-command-api-v2',
    'fabric-creative-tab-api-v1',
    'fabric-events-interaction-v0',
    'fabric-key-mapping-api-v1',
    'fabric-lifecycle-events-v1',
    'fabric-message-api-v1',
    'fabric-model-loading-api-v1',
    'fabric-networking-api-v1',
    'fabric-object-builder-api-v1',
    'fabric-registry-sync-v0',
    'fabric-renderer-api-v1',
    'fabric-renderer-indigo',
    'fabric-rendering-v1',
    'fabric-resource-loader-v1',
    'fabric-screen-api-v1',
    'fabric-transitive-access-wideners-v1'
]

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // Compile against full Fabric API, bundle only required modules in the output jar
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    for (String modName : bundledFabricModules) {
        def dep = fabricApi.module(modName, project.fabric_version)
        localRuntime dep
        include dep
    }

    implementation project(':mcef')
    include project(':mcef')

    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }
    include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }
}

loom {
    accessWidenerPath = file('src/main/resources/webdisplays.accesswidener')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

kotlin {
    jvmToolchain(25)
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
