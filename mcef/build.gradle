plugins {
    id 'fabric-loom'
}

base {
    archivesName = archives_base_name
}

version = mcef_version
group = maven_group

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/jcef/java']
            exclude '**/tests/**'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    Set<String> apiModules = [
            'fabric-api-base',
            'fabric-command-api-v2',
            'fabric-lifecycle-events-v1',
            'fabric-networking-api-v1',
            'fabric-resource-loader-v0',
            'fabric-key-binding-api-v1'
    ]

    apiModules.each { moduleName ->
        modImplementation(fabricApi.module(moduleName, fabric_api_version))
    }
}

loom {
    mixin {
        defaultRefmapName = 'mcef.refmap.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_vendor', mod_vendor
    inputs.property 'mod_version', mcef_version
    inputs.property 'java_version', java_version
    inputs.property 'minecraft_dependency', minecraft_dependency
    inputs.property 'fabric_loader_version', fabric_loader_version
    inputs.property 'min_fabric_version', min_fabric_version

    filesMatching('fabric.mod.json') {
        expand 'mod_id': mod_id,
                'mod_name': mod_name,
                'mod_vendor': mod_vendor,
                'mod_version': mcef_version,
                'java_version': java_version,
                'minecraft_dependency': minecraft_dependency,
                'fabric_loader_version': fabric_loader_version,
                'min_fabric_version': min_fabric_version
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Vendor': mod_vendor,
                'Specification-Version': '1',
                'Implementation-Title': mod_name,
                'Implementation-Version': mcef_version,
                'Implementation-Vendor': mod_vendor,
                'java-cef-commit': java_cef_commit
        )
    }
}
