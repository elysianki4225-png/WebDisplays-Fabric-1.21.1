name: Build WebDisplays Fabric 1.21.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bundled mod JAR
        id: gradle_build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Post failure log to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          with open("build.log", "r", errors="replace") as f:
              lines = f.readlines()
          tail = "".join(lines[-250:])
          if len(tail) > 60000:
              tail = tail[-60000:]
          body = "### Build failed\n```text\n" + tail + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Inspect and summarize built JAR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh build/libs/ > jar_summary.txt
          echo "" >> jar_summary.txt
          MAIN_JAR=$(ls build/libs/webdisplays-fabric-*.jar | grep -vE '(-sources|-dev)\.jar$' | head -n1)
          echo "Main JAR: $MAIN_JAR" >> jar_summary.txt
          unzip -l "$MAIN_JAR" | grep -E 'META-INF/jars/|fabric\.mod\.json' >> jar_summary.txt || true
          python3 - <<'PY'
          import os, subprocess
          with open("jar_summary.txt", "r", errors="replace") as f:
              summary = f.read()
          body = "### Build succeeded\n```text\n" + summary[:60000] + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Upload built mod JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webdisplays-fabric-1.21.1-all-in-one
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

      - name: Publish JAR to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_JAR=$(ls build/libs/webdisplays-fabric-*.jar | grep -vE '(-sources|-dev)\.jar$' | head -n1)
          TAG="build-${GITHUB_SHA::7}"
          gh release create "$TAG" "$MAIN_JAR" \
            --target "${GITHUB_SHA}" \
            --title "WebDisplays Fabric 1.21.1 ($TAG)" \
            --notes "Automated standalone build with bundled MCEF, Cloth Config, and Fabric API modules (ARM64 + x86_64)." \
            --prerelease || gh release upload "$TAG" "$MAIN_JAR" --clobber
