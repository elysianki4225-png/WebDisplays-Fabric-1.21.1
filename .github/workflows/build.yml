name: Build WebDisplays Fabric (1.21.1 & 26.3)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-1-21-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 1.21.1 bundled mod JAR
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --info 2>&1 | tee build-1.21.1.log

      - name: Post 1.21.1 failure log to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          with open("build-1.21.1.log", "r", errors="replace") as f:
              lines = f.readlines()
          out = []
          for i, l in enumerate(lines):
              if "error:" in l or "FAILURE:" in l or "What went wrong" in l or l.startswith("> Task"):
                  start = max(0, i - 2)
                  end = min(len(lines), i + 8)
                  out.extend(lines[start:end])
          if not out:
              out = lines[-200:]
          body_text = "".join(out)
          if len(body_text) > 55000:
              body_text = body_text[-55000:]
          body = "### Build failed (1.21.1)\n```text\n" + body_text + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Upload 1.21.1 mod JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webdisplays-fabric-1.21.1-all-in-one
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

  build-26-3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x versions/26.3/gradlew

      - name: Build 26.3 bundled mod JAR
        working-directory: versions/26.3
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --info 2>&1 | tee build-26.3.log

      - name: Post 26.3 failure log to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          with open("versions/26.3/build-26.3.log", "r", errors="replace") as f:
              lines = f.readlines()
          out = []
          for i, l in enumerate(lines):
              if "error:" in l or "FAILURE:" in l or "What went wrong" in l or l.startswith("> Task"):
                  start = max(0, i - 2)
                  end = min(len(lines), i + 8)
                  out.extend(lines[start:end])
          if not out:
              out = lines[-200:]
          body_text = "".join(out)
          if len(body_text) > 55000:
              body_text = body_text[-55000:]
          body = "### Build failed (26.3)\n```text\n" + body_text + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Verify 26.3 Mixin and AccessWidener targets
        if: success()
        working-directory: versions/26.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, sys

          jars = glob.glob(".gradle/loom-cache/**/minecraft*.jar", recursive=True)
          jars += glob.glob(os.path.expanduser("~/.gradle/caches/fabric-loom/**/minecraft*.jar"), recursive=True)
          jars = [j for j in jars if not j.endswith(("-sources.jar", "-javadoc.jar"))]
          print("Candidate MC jars:", jars)
          if not jars:
              print("No cached minecraft jar found; skipping javap verification.")
              sys.exit(0)
          mc_jar = max(jars, key=os.path.getsize)
          print("Using MC jar:", mc_jar)

          checks = {
              "net.minecraft.world.entity.LivingEntity": ["createItemStackToDrop(net.minecraft.world.item.ItemStack, boolean, boolean)", "(Lnet/minecraft/world/item/ItemStack;ZZ)Lnet/minecraft/world/entity/item/ItemEntity;"],
              "net.minecraft.world.entity.player.Player": [],
              "net.minecraft.world.entity.item.ItemEntity": ["tick()"],
              "net.minecraft.client.MouseHandler": ["onButton(", "mouseGrabbed"],
              "net.minecraft.client.gui.Gui": ["setScreen("],
              "net.minecraft.client.Minecraft": ["renderFrame(", "close()"],
              "net.minecraft.client.resources.ClientPackSource": ["static {};"],
              "net.minecraft.world.phys.AABB": ["minX", "minY", "minZ", "maxX", "maxY", "maxZ"],
          }

          missing = []
          details = []
          for cls, needles in checks.items():
              out = subprocess.check_output(["javap", "-s", "-p", "-cp", mc_jar, cls], text=True, errors="replace")
              for n in needles:
                  if n not in out:
                      missing.append(f"{cls} :: missing '{n}'")
              interesting = [line.strip() for line in out.splitlines() if any(k in line for k in ("drop", "Drop", "tick(", "onButton", "mouseGrabbed", "setScreen", "renderFrame", "runTick", "close(", "exitWorld", "static {", "minX", "descriptor:"))]
              details.append(f"=== {cls} ===\n" + "\n".join(interesting[:60]))

          report = "\n\n".join(details)
          if missing:
              body = "### 26.3 Mixin / AccessWidener target check FAILED\nMissing:\n" + "\n".join(f"- {m}" for m in missing) + "\n\n```text\n" + report[:50000] + "\n```"
              repo = os.environ["GITHUB_REPOSITORY"]
              sha = os.environ["GITHUB_SHA"]
              subprocess.run(["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"], check=True)
              print("MISSING:", missing)
              sys.exit(1)
          print("All Mixin and AccessWidener targets verified OK!")
          PY

      - name: Inspect and summarize 26.3 JAR
        if: success()
        working-directory: versions/26.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "=== versions/26.3/build/libs ==="
            ls -lh build/libs/ || true
            echo "=== versions/26.3/mcef/build/libs ==="
            ls -lh mcef/build/libs/ || true
            echo ""
            MAIN_JAR=$(ls build/libs/webdisplays-fabric-*.jar | grep -vE '(-sources|-dev)\.jar$' | head -n1)
            echo "Main JAR: $MAIN_JAR"
            unzip -l "$MAIN_JAR" | grep -E 'META-INF/jars/|fabric\.mod\.json' || unzip -l "$MAIN_JAR"
          } > jar_summary.txt
          python3 - <<'PY'
          import os, subprocess
          with open("jar_summary.txt", "r", errors="replace") as f:
              summary = f.read()
          body = "### Build succeeded (26.3)\n```text\n" + summary[:60000] + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Upload 26.3 mod JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webdisplays-fabric-26.3-all-in-one
          path: |
            versions/26.3/build/libs/*.jar
            !versions/26.3/build/libs/*-sources.jar
            !versions/26.3/build/libs/*-dev.jar

  publish-release:
    if: github.event_name == 'push'
    needs: [build-1-21-1, build-26-3]
    runs-on: ubuntu-latest

    steps:
      - name: Download 1.21.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: webdisplays-fabric-1.21.1-all-in-one
          path: release-artifacts

      - name: Download 26.3 artifact
        uses: actions/download-artifact@v4
        with:
          name: webdisplays-fabric-26.3-all-in-one
          path: release-artifacts

      - name: Publish JARs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_SHA::7}"
          gh release create "$TAG" release-artifacts/*.jar \
            --repo "${{ github.repository }}" \
            --target "${GITHUB_SHA}" \
            --title "WebDisplays Fabric 1.21.1 & 26.3 ($TAG)" \
            --notes "Automated standalone builds for Minecraft Fabric 1.21.1 and 26.3 with bundled MCEF, Cloth Config, and Fabric API modules (ARM64 + x86_64)." \
            --prerelease || gh release upload "$TAG" release-artifacts/*.jar --repo "${{ github.repository }}" --clobber
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            gh release create "latest" release-artifacts/*.jar \
              --repo "${{ github.repository }}" \
              --target "${GITHUB_SHA}" \
              --title "WebDisplays Fabric Latest (1.21.1 & 26.3)" \
              --notes "Latest stable standalone builds for Minecraft Fabric 1.21.1 and 26.3 (ARM64 + x86_64, all dependencies bundled)." \
              || gh release upload "latest" release-artifacts/*.jar --repo "${{ github.repository }}" --clobber
          fi
