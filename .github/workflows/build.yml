name: Build WebDisplays Fabric 1.21.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bundled mod JAR
        id: gradle_build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --info 2>&1 | tee build.log

      - name: Post failure log to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          with open("build.log", "r", errors="replace") as f:
              lines = f.readlines()
          out = []
          for i, l in enumerate(lines):
              if "error:" in l or "FAILURE:" in l or "What went wrong" in l or l.startswith("> Task"):
                  start = max(0, i - 2)
                  end = min(len(lines), i + 8)
                  out.extend(lines[start:end])
          if not out:
              out = lines[-200:]
          body_text = "".join(out)
          if len(body_text) > 55000:
              body_text = body_text[-55000:]
          body = "### Build failed\n```text\n" + body_text + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Inspect and summarize built JAR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "=== Task :remapJar info ==="
            awk '/^> Task :remapJar/,/^> Task /' build.log | head -n 120 || true
            echo "=== Task :mcef:remapJar info ==="
            awk '/^> Task :mcef:remapJar/,/^> Task /' build.log | head -n 80 || true
            echo "=== build/libs ==="
            ls -lh build/libs/ || true
            echo "=== build/devlibs ==="
            ls -lh build/devlibs/ || true
          } > jar_summary.txt
          python3 - <<'PY'
          import os, subprocess
          with open("jar_summary.txt", "r", errors="replace") as f:
              summary = f.read()
          body = "### Build succeeded\n```text\n" + summary[:60000] + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Upload built mod JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webdisplays-fabric-1.21.1-all-in-one
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

      - name: Publish JAR to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_JAR=$(ls build/libs/webdisplays-fabric-*.jar | grep -vE '(-sources|-dev)\.jar$' | head -n1)
          TAG="build-${GITHUB_SHA::7}"
          gh release create "$TAG" "$MAIN_JAR" \
            --target "${GITHUB_SHA}" \
            --title "WebDisplays Fabric 1.21.1 ($TAG)" \
            --notes "Automated standalone build with bundled MCEF, Cloth Config, and Fabric API modules (ARM64 + x86_64)." \
            --prerelease || gh release upload "$TAG" "$MAIN_JAR" --clobber
