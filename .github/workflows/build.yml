name: Build WebDisplays Fabric (1.21.1 & 26.3)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-1-21-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 1.21.1 bundled mod JAR
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --info 2>&1 | tee build-1.21.1.log

      - name: Post 1.21.1 failure log to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          with open("build-1.21.1.log", "r", errors="replace") as f:
              lines = f.readlines()
          out = []
          for i, l in enumerate(lines):
              if "error:" in l or l.startswith("e:") or "FAILURE:" in l or "What went wrong" in l or l.startswith("> Task"):
                  start = max(0, i - 2)
                  end = min(len(lines), i + 8)
                  out.extend(lines[start:end])
          if not out:
              out = lines[-200:]
          body_text = "".join(out)
          if len(body_text) > 55000:
              body_text = body_text[-55000:]
          body = "### Build failed (1.21.1)\n```text\n" + body_text + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Upload 1.21.1 mod JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webdisplays-fabric-1.21.1-all-in-one
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

  build-26-3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x versions/26.3/gradlew

      - name: Build 26.3 bundled mod JAR
        working-directory: versions/26.3
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --info 2>&1 | tee build-26.3.log

      - name: Post 26.3 failure log to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          with open("versions/26.3/build-26.3.log", "r", errors="replace") as f:
              lines = f.readlines()
          out = []
          for i, l in enumerate(lines):
              if "error:" in l or l.startswith("e:") or "FAILURE:" in l or "What went wrong" in l or l.startswith("> Task"):
                  start = max(0, i - 2)
                  end = min(len(lines), i + 8)
                  out.extend(lines[start:end])
          if not out:
              out = lines[-200:]
          body_text = "".join(out)
          if len(body_text) > 55000:
              body_text = body_text[-55000:]
          body = "### Build failed (26.3)\n```text\n" + body_text + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Verify 26.3 Mixin and AccessWidener targets
        if: success()
        working-directory: versions/26.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, sys, traceback

          def post_comment(body):
              repo = os.environ["GITHUB_REPOSITORY"]
              sha = os.environ["GITHUB_SHA"]
              subprocess.run(["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body[:60000]}"], check=True)

          try:
              import zipfile
              candidates = (
                  glob.glob(".gradle/loom-cache/**/*.jar", recursive=True)
                  + glob.glob(os.path.expanduser("~/.gradle/caches/fabric-loom/**/*.jar"), recursive=True)
              )
              candidates = [j for j in candidates if not j.endswith(("-sources.jar", "-javadoc.jar"))]
              mc_jar = None
              for j in sorted(candidates, key=os.path.getsize, reverse=True):
                  try:
                      with zipfile.ZipFile(j) as zf:
                          if "net/minecraft/client/Minecraft.class" in zf.namelist():
                              mc_jar = j
                              break
                  except Exception:
                      pass
              if mc_jar is None:
                  raise RuntimeError("Could not find merged MC jar in: " + str(candidates[:20]))

              checks = {
                  "net.minecraft.world.entity.LivingEntity": ["createItemStackToDrop(net.minecraft.world.item.ItemStack, boolean, boolean)", "(Lnet/minecraft/world/item/ItemStack;ZZ)Lnet/minecraft/world/entity/item/ItemEntity;"],
                  "net.minecraft.world.entity.player.Player": [],
                  "net.minecraft.world.entity.item.ItemEntity": ["tick()"],
                  "net.minecraft.client.MouseHandler": ["onButton(", "mouseGrabbed"],
                  "net.minecraft.client.gui.Gui": ["setScreen("],
                  "net.minecraft.client.Minecraft": ["renderFrame(", "close()"],
                  "net.minecraft.client.resources.ClientPackSource": ["static {};"],
                  "net.minecraft.world.phys.AABB": ["minX", "minY", "minZ", "maxX", "maxY", "maxZ"],
              }

              missing = []
              details = [f"MC jar: {mc_jar} ({os.path.getsize(mc_jar)} bytes)"]
              for cls, needles in checks.items():
                  proc = subprocess.run(["javap", "-s", "-p", "-cp", mc_jar, cls], capture_output=True, text=True, errors="replace")
                  if proc.returncode != 0:
                      missing.append(f"{cls} :: javap failed: {proc.stderr.strip()}")
                      continue
                  out = proc.stdout
                  for n in needles:
                      if n not in out:
                          missing.append(f"{cls} :: missing '{n}'")
                  lines = out.splitlines()
                  interesting = []
                  for i, line in enumerate(lines):
                      if any(k in line for k in ("drop", "Drop", "tick(", "onButton", "mouseGrabbed", "setScreen", "renderFrame", "runTick", "close(", "exitWorld", "static {", "minX")):
                          interesting.append(line.strip())
                          if i + 1 < len(lines) and "descriptor:" in lines[i + 1]:
                              interesting.append("  " + lines[i + 1].strip())
                  details.append(f"=== {cls} ===\n" + "\n".join(interesting[:60]))

              report = "\n\n".join(details)
              inspect_classes = [
                  "net.minecraft.client.MouseHandler",
                  "com.mojang.blaze3d.platform.InputConstants",
                  "net.minecraft.client.input.MouseButtonInfo",
                  "net.minecraft.client.input.MouseButtonEvent",
                  "net.minecraft.client.gui.screens.Screen",
                  "net.minecraft.client.renderer.entity.ItemEntityRenderer",
                  "net.minecraft.client.renderer.entity.state.ItemEntityRenderState",
                  "net.minecraft.client.renderer.ItemInHandRenderer",
                  "net.minecraft.client.model.HumanoidModel",
                  "net.minecraft.client.renderer.entity.player.AvatarRenderer",
                  "net.minecraft.client.renderer.entity.state.AvatarRenderState",
                  "net.minecraft.client.renderer.entity.player.PlayerRenderer",
                  "net.minecraft.client.renderer.entity.state.PlayerRenderState",
                  "net.minecraft.world.entity.LivingEntity",
              ]
              inspect_out = []
              for ic in inspect_classes:
                  p = subprocess.run(["javap", "-s", "-p", "-cp", mc_jar, ic], capture_output=True, text=True, errors="replace")
                  if p.returncode == 0:
                      if ic == "net.minecraft.world.entity.LivingEntity":
                          lines = p.stdout.splitlines()
                          filtered = []
                          for idx, ln in enumerate(lines):
                              if "swing" in ln.lower() or "arm" in ln.lower():
                                  filtered.append(ln)
                                  if idx + 1 < len(lines) and "descriptor:" in lines[idx + 1]:
                                      filtered.append(lines[idx + 1])
                          inspect_out.append(f"=== {ic} (swing/arm) ===\n" + "\n".join(filtered[:60]))
                      else:
                          inspect_out.append(f"=== {ic} ===\n" + "\n".join(p.stdout.splitlines()[:90]))
                  else:
                      inspect_out.append(f"=== {ic} === NOT FOUND")
              post_comment("### 26.3 API inspection\n```text\n" + "\n\n".join(inspect_out)[:58000] + "\n```")
              if missing:
                  post_comment("### 26.3 Mixin / AccessWidener check FAILED\nMissing:\n" + "\n".join(f"- {m}" for m in missing) + "\n\n```text\n" + report[:50000] + "\n```")
                  sys.exit(1)
              print("All Mixin and AccessWidener targets verified OK!")
          except Exception:
              post_comment("### 26.3 Mixin check crashed\n```text\n" + traceback.format_exc() + "\n```")
              sys.exit(1)
          PY

      - name: Inspect and summarize 26.3 JAR
        if: success()
        working-directory: versions/26.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "=== versions/26.3/build/libs ==="
            ls -lh build/libs/ || true
            echo "=== versions/26.3/mcef/build/libs ==="
            ls -lh mcef/build/libs/ || true
            echo ""
            MAIN_JAR=$(ls build/libs/webdisplays-fabric-*.jar | grep -vE '(-sources|-dev)\.jar$' | head -n1)
            echo "Main JAR: $MAIN_JAR"
            unzip -l "$MAIN_JAR" | grep -E 'META-INF/jars/|fabric\.mod\.json' || unzip -l "$MAIN_JAR"
          } > jar_summary.txt
          python3 - <<'PY'
          import os, subprocess
          with open("jar_summary.txt", "r", errors="replace") as f:
              summary = f.read()
          body = "### Build succeeded (26.3)\n```text\n" + summary[:60000] + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY

      - name: Upload 26.3 mod JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webdisplays-fabric-26.3-all-in-one
          path: |
            versions/26.3/build/libs/*.jar
            !versions/26.3/build/libs/*-sources.jar
            !versions/26.3/build/libs/*-dev.jar

  publish-release:
    if: github.event_name == 'push'
    needs: [build-1-21-1, build-26-3]
    runs-on: ubuntu-latest

    steps:
      - name: Download 1.21.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: webdisplays-fabric-1.21.1-all-in-one
          path: release-artifacts

      - name: Download 26.3 artifact
        uses: actions/download-artifact@v4
        with:
          name: webdisplays-fabric-26.3-all-in-one
          path: release-artifacts

      - name: Publish JARs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_SHA::7}"
          gh release create "$TAG" release-artifacts/*.jar \
            --repo "${{ github.repository }}" \
            --target "${GITHUB_SHA}" \
            --title "WebDisplays Fabric 1.21.1 & 26.3 ($TAG)" \
            --notes "Automated standalone builds for Minecraft Fabric 1.21.1 and 26.3 with bundled MCEF, Cloth Config, and Fabric API modules (ARM64 + x86_64)." \
            --prerelease || gh release upload "$TAG" release-artifacts/*.jar --repo "${{ github.repository }}" --clobber
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            gh release create "latest" release-artifacts/*.jar \
              --repo "${{ github.repository }}" \
              --target "${GITHUB_SHA}" \
              --title "WebDisplays Fabric Latest (1.21.1 & 26.3)" \
              --notes "Latest stable standalone builds for Minecraft Fabric 1.21.1 and 26.3 (ARM64 + x86_64, all dependencies bundled)." \
              || gh release upload "latest" release-artifacts/*.jar --repo "${{ github.repository }}" --clobber
          fi
